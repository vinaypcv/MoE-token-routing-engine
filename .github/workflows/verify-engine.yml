name: Infrastructure Compilation & Verification Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Install AF_XDP Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm m4 libelf-dev zlib1g-dev

      - name: Setup System Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Formatting Layouts
        run: cargo fmt --check

      - name: Run Deep Static Memory Analysis Lints
        run: cargo clippy -p moe_holistic_engine --all-targets --all-features -- -D warnings

      - name: Run Host Engine Tests
        run: cargo test -p moe_holistic_engine --no-fail-fast

      - name: Run Main Engine
        run: cargo run --release --bin moe_holistic_engine

      - name: Run Speculative Kernel
        run: cargo run --release --bin speculative_kernel

  build-ebpf:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v5

      - name: Install AF_XDP Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm m4 libelf-dev zlib1g-dev

      - name: Setup Nightly Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          components: rust-src

      - name: Install BPF Linker
        run: cargo +nightly-2025-12-01 install bpf-linker --version 0.9.14

      - name: Build eBPF Object
        run: cargo build -Z build-std=core --release -p moe-ebpf-kernel --target bpfel-unknown-none

      - name: Build AF_XDP Userspace Loader
        run: cargo build --release --bin xdp_loader

      - name: Write Build Metadata
        run: |
          mkdir -p artifacts
          printf 'commit=%s\n' "$GITHUB_SHA" > artifacts/build-metadata.txt
          printf 'runner=%s\n' "$RUNNER_OS" >> artifacts/build-metadata.txt
          printf 'kernel_target=%s\n' 'bpfel-unknown-none' >> artifacts/build-metadata.txt
          printf 'toolchain=%s\n' 'nightly-2025-12-01' >> artifacts/build-metadata.txt
          sha256sum target/bpfel-unknown-none/release/libmoe_ebpf_kernel.so >> artifacts/build-metadata.txt
          sha256sum target/release/xdp_loader >> artifacts/build-metadata.txt

      - name: Upload AF_XDP Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: af-xdp-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/bpfel-unknown-none/release/libmoe_ebpf_kernel.so
            target/release/xdp_loader
            artifacts/build-metadata.txt
