[package]
name = "moe_holistic_engine"
version = "1.0.0"
edition = "2021"
default-run = "moe_holistic_engine"
autobins = false
authors = ["Independent Solo Professional"]
description = "A holistic, zero-copy distributed MoE token routing, multi-GPU mmap, and thread-pinned engine."

[lib]
name = "moe_holistic_engine"
path = "src/main.rs"

[[bin]]
name = "moe_holistic_engine"
path = "src/bin/moe_holistic_engine.rs"

[[bin]]
name = "speculative_kernel"
path = "src/bin/speculative_kernel.rs"

[dependencies]
rio = "0.9"
crossbeam-utils = "0.8"
core_affinity = "0.8"
socket2 = "0.6"
libc = "0.2"
crossbeam-channel = "0.5"
aya = "0.12.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
xsk-rs = { version = "0.11.0", features = ["use_cc_build"] }

[[bin]]
name = "xdp_loader"
path = "src/bin/xdp_loader.rs"

[[bin]]
name = "bench_ingestion"
path = "src/bin/bench_ingestion.rs"

[[bin]]
name = "traffic_profiler"
path = "src/bin/traffic_profiler.rs"

[[bin]]
name = "telemetry_demo"
path = "src/bin/telemetry_demo.rs"

[workspace]
members = [".", "moe-ebpf-kernel"]
default-members = ["."]
resolver = "2"

[[bench]]
name = "holistic_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
